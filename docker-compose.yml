services:
  lidarr-deezer-scheduler:
    build: .
    container_name: lidarr-deezer-scheduler
    restart: unless-stopped
    ports:
      - "${WEBUI_HOST_PORT:-8081}:8080"
    environment:
      # Optional legacy/bootstrap values. The Web UI saves configuration to /data.
      LIDARR_URL: "${LIDARR_URL:-}"
      LIDARR_API_KEY: "${LIDARR_API_KEY:-}"
      TZ: "${TZ:-America/Chicago}"
      SEARCH_WINDOW_ENABLED: "${SEARCH_WINDOW_ENABLED:-true}"
      SEARCH_WINDOW_START: "${SEARCH_WINDOW_START:-07:00}"
      SEARCH_WINDOW_END: "${SEARCH_WINDOW_END:-23:00}"

      # Daily caps (a random value in each range is picked every local day)
      MIN_SEARCHES_PER_DAY: "${MIN_SEARCHES_PER_DAY:-}"
      MAX_SEARCHES_PER_DAY: "${MAX_SEARCHES_PER_DAY:-100}"
      MIN_DOWNLOADS_PER_DAY: "${MIN_DOWNLOADS_PER_DAY:-}"
      MAX_DOWNLOADS_PER_DAY: "${MAX_DOWNLOADS_PER_DAY:-30}"

      # Search pacing
      BATCH_SIZE: "${BATCH_SIZE:-5}"
      MIN_CHUNK_DELAY_SECONDS: "${MIN_CHUNK_DELAY_SECONDS:-900}"
      MAX_CHUNK_DELAY_SECONDS: "${MAX_CHUNK_DELAY_SECONDS:-2700}"
      IDLE_RETRY_SECONDS: "${IDLE_RETRY_SECONDS:-300}"
      ALBUM_COOLDOWN_HOURS: "${ALBUM_COOLDOWN_HOURS:-72}"
      COMMAND_TIMEOUT_SECONDS: "${COMMAND_TIMEOUT_SECONDS:-600}"

      # Album selection
      SEARCH_ORDER: "${SEARCH_ORDER:-newest_artist}"
      MISSING_PAGE_SIZE: "${MISSING_PAGE_SIZE:-500}"
      MISSING_REFRESH_MINUTES: "${MISSING_REFRESH_MINUTES:-360}"

      # Indexer management
      DEEZER_INDEXER_NAME: "${DEEZER_INDEXER_NAME:-Deezer}"
      MANAGE_DEEZER_AUTOMATIC_SEARCH: "${MANAGE_DEEZER_AUTOMATIC_SEARCH:-true}"
      MANAGE_OTHER_INDEXERS: "${MANAGE_OTHER_INDEXERS:-true}"
      OTHER_INDEXERS_EXCLUDE: "${OTHER_INDEXERS_EXCLUDE:-}"

      # Failure safety check
      SAFETY_CHECK_ENABLED: "${SAFETY_CHECK_ENABLED:-true}"
      DEEZER_DOWNLOAD_CLIENT_NAME: "${DEEZER_DOWNLOAD_CLIENT_NAME:-}"
      FAIL_LOOKBACK_HOURS: "${FAIL_LOOKBACK_HOURS:-24}"
      FAIL_MIN_FAILURES: "${FAIL_MIN_FAILURES:-3}"
      FAIL_RATIO: "${FAIL_RATIO:-0.5}"
      FAIL_PAUSE_HOURS: "${FAIL_PAUSE_HOURS:-12}"

      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
      WEBUI_PORT: "8080"
      WEBUI_USERNAME: "${WEBUI_USERNAME:-admin}"
    volumes:
      - scheduler-data:/data

volumes:
  scheduler-data:
